<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz for Shreya 💖</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background music (hidden) -->
  <audio id="bgAudio" src="tum-se-hi.mp3" loop></audio>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Toast for sweet corrections -->
  <div id="toast" class="toast"></div>

  <!-- 1) Intro Screen -->
  <div id="intro" class="screen">
    <h1>Let's Take a Quiz!</h1>
    <p>Answer these fun questions about us ❤️</p>
    <button id="startBtn" class="btn-accent">Start Quiz</button>
  </div>

  <!-- 2) Quiz Screen -->
  <div id="quiz" class="screen hidden">
    <h2 id="qText"></h2>
    <div id="options"></div>
  </div>

  <!-- 3) Final Screen -->
  <div id="final" class="screen hidden">
    <h1>You did it! 🎉</h1>
    <p class="final-msg">I love you, Shreya ❤️</p>
    <!-- Shayari at the end -->
    <div class="shayari">
      <p>In your smile I find my sunrise,</p>
      <p>Your laughter lifts me sky‑high.</p>
      <p>Three years back you walked into my song,</p>
      <p>Since then every beat’s felt right.</p>
    </div>
  </div>

  <!-- Canvas‑Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
